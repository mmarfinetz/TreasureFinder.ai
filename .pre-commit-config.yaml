# Pre-commit hooks to enforce production code quality
# Install with: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      - id: check-no-synthetic-data
        name: Check for synthetic/random data generation
        entry: scripts/check_no_synthetic.sh
        language: script
        files: '\.(py|ipynb)$'
        exclude: '^(tests/|test_.*\.py|.*_test\.py|scripts/generate_test_data\.py)'
        
      - id: check-no-print-statements
        name: Check for print statements (use logger instead)
        entry: scripts/check_no_print.sh
        language: script
        files: '\.py$'
        exclude: '^(tests/|test_.*\.py|.*_test\.py|quick_test\.py)'
        
      - id: check-error-handling
        name: Check for proper error handling
        entry: scripts/check_error_handling.py
        language: python
        files: '\.py$'
        exclude: '^(tests/|test_.*\.py|.*_test\.py)'

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.9
        
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--ignore=E203,W503']
        exclude: '^(tests/|migrations/)'